<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Ultra-Luxe 24K Gold Linear Gradient -->
    <linearGradient id="pureGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE0" />
      <stop offset="20%" stop-color="#FCE588" />
      <stop offset="45%" stop-color="#E5BA42" />
      <stop offset="70%" stop-color="#C49323" />
      <stop offset="90%" stop-color="#8F620D" />
      <stop offset="100%" stop-color="#5E3E04" />
    </linearGradient>

    <!-- Bright Champagne Highlight Gradient -->
    <linearGradient id="brightGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FFF1B8" />
      <stop offset="70%" stop-color="#F2CF66" />
      <stop offset="100%" stop-color="#C99824" />
    </linearGradient>

    <!-- Warm Copper-Gold for deep accents -->
    <linearGradient id="deepGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A67319" />
      <stop offset="50%" stop-color="#E0B143" />
      <stop offset="100%" stop-color="#8A5A0A" />
    </linearGradient>

    <!-- Divine Sindoor Vermilion -->
    <linearGradient id="sindoor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3838" />
      <stop offset="50%" stop-color="#D91414" />
      <stop offset="100%" stop-color="#8A0000" />
    </linearGradient>

    <!-- Golden Ladoo/Modak Gradient -->
    <radialGradient id="modakGlow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="40%" stop-color="#FFD54F" />
      <stop offset="75%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#B26A00" />
    </radialGradient>

    <!-- Radiant Prabhavali Back-Glow -->
    <radialGradient id="divineAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE885" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.18" />
      <stop offset="80%" stop-color="#C9A84C" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0B1829" stop-opacity="0" />
    </radialGradient>

    <!-- Lotus Petal Gradients -->
    <linearGradient id="lotusGold" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7A4E06" />
      <stop offset="40%" stop-color="#C49323" />
      <stop offset="75%" stop-color="#F7D774" />
      <stop offset="100%" stop-color="#FFF5C2" />
    </linearGradient>

    <!-- Drop Shadow / Glow Filter -->
    <filter id="royalGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.75" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. DIVINE AURA BACKDROP -->
  <circle cx="100" cy="100" r="94" fill="url(#divineAura)" />

  <!-- 2. ORNATE TEMPLE MANDALA / PRABHAVALI (AUREOLE) -->
  <g opacity="0.85" filter="url(#royalGlow)">
    <!-- Outer beaded ring -->
    <circle cx="100" cy="96" r="82" fill="none" stroke="url(#pureGold)" stroke-width="1.2" stroke-dasharray="1.5 3.5" />
    <circle cx="100" cy="96" r="77" fill="none" stroke="url(#brightGold)" stroke-width="0.8" opacity="0.6" />
    <circle cx="100" cy="96" r="72" fill="none" stroke="url(#deepGold)" stroke-width="1.8" />
    
    <!-- Arch Ray Accents (Sunburst of prosperity) -->
    <g stroke="url(#brightGold)" stroke-width="1" opacity="0.5">
      <line x1="100" y1="14" x2="100" y2="21" />
      <line x1="140" y1="26" x2="135" y2="32" />
      <line x1="60" y1="26" x2="65" y2="32" />
      <line x1="172" y1="58" x2="165" y2="62" />
      <line x1="28" y1="58" x2="35" y2="62" />
      <line x1="181" y1="96" x2="173" y2="96" />
      <line x1="19" y1="96" x2="27" y2="96" />
    </g>

    <!-- Auspicious Kalash Finial Top Center -->
    <path d="M96 16 C96 12 100 8 100 8 C100 8 104 12 104 16 C104 18 96 18 96 16 Z" fill="url(#brightGold)" />
    <circle cx="100" cy="7" r="2.2" fill="#FF4444" stroke="url(#brightGold)" stroke-width="0.6" />
  </g>

  <!-- 3. BLOOMING GOLDEN LOTUS THRONE (कमलासन) AT THE BASE -->
  <g id="lotus-throne" transform="translate(0, 10)">
    <!-- Base center petals -->
    <path d="M100 162 C90 148 74 152 68 160 C76 164 90 164 100 162 Z" fill="url(#lotusGold)" stroke="#FFF1B8" stroke-width="0.6" />
    <path d="M100 162 C110 148 126 152 132 160 C124 164 110 164 100 162 Z" fill="url(#lotusGold)" stroke="#FFF1B8" stroke-width="0.6" />
    <!-- Center front petal -->
    <path d="M100 150 C92 156 88 165 100 171 C112 165 108 156 100 150 Z" fill="url(#brightGold)" stroke="#8F620D" stroke-width="0.6" />
    <circle cx="100" cy="162" r="1.5" fill="#FF3838" />
    <!-- Left outer petals -->
    <path d="M68 160 C56 152 44 158 40 165 C52 167 62 165 68 160 Z" fill="url(#pureGold)" opacity="0.85" />
    <!-- Right outer petals -->
    <path d="M132 160 C144 152 156 158 160 165 C148 167 138 165 132 160 Z" fill="url(#pureGold)" opacity="0.85" />
  </g>

  <!-- 4. LORD GANESHA - DIVINE FORM -->
  <g filter="url(#royalGlow)">
    
    <!-- ROYAL MUKUT (CROWN) -->
    <!-- Base Filigree Band -->
    <path d="M78 62 C85 59 115 59 122 62 C120 65 80 65 78 62 Z" fill="url(#brightGold)" stroke="#7A4E06" stroke-width="0.5" />
    <circle cx="85" cy="62" r="1.2" fill="#FFFBE0" />
    <circle cx="93" cy="61.5" r="1.4" fill="#E53935" />
    <circle cx="100" cy="61" r="1.8" fill="#FFFBE0" />
    <circle cx="107" cy="61.5" r="1.4" fill="#E53935" />
    <circle cx="115" cy="62" r="1.2" fill="#FFFBE0" />

    <!-- Tier 1 Crown -->
    <path d="M80 60 C80 60 88 44 100 42 C112 44 120 60 120 60 C112 58 88 58 80 60 Z" 
          fill="url(#pureGold)" stroke="#FFE885" stroke-width="0.8" />
    <!-- Ruby Gem Tier 1 -->
    <path d="M100 45 L103 50 L100 55 L97 50 Z" fill="url(#sindoor)" stroke="url(#brightGold)" stroke-width="0.6" />
    <circle cx="100" cy="50" r="1" fill="#FFFFFF" />

    <!-- Tier 2 Crown (Upper Pinnacle) -->
    <path d="M87 43 C91 35 100 30 100 30 C100 30 109 35 113 43 C107 41 93 41 87 43 Z" 
          fill="url(#brightGold)" stroke="#8F620D" stroke-width="0.6" />
    
    <!-- Mukut Kalash Shikhara (Apex Jewel) -->
    <path d="M98 30 C97 27 100 23 100 23 C100 23 103 27 102 30 Z" fill="#FFFDF0" />
    <circle cx="100" cy="22" r="2.2" fill="url(#sindoor)" stroke="#FFE885" stroke-width="0.6" />
    <circle cx="100" cy="22" r="0.8" fill="#FFFFFF" />

    <!-- EARS (KARNA) - Ornate & Auspicious -->
    <!-- Right Ear (Viewer Left) -->
    <path d="M79 66 C59 64 42 72 44 91 C46 104 60 106 68 102 C65 96 66 84 76 77" 
          stroke="url(#pureGold)" stroke-width="4.2" stroke-linecap="round" fill="none" />
    <!-- Ear Inner Filigree -->
    <path d="M56 78 C50 85 52 94 62 96" 
          stroke="url(#brightGold)" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M60 83 C57 87 58 91 64 92" 
          stroke="#FFEAA7" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.75" />
    <!-- Royal Kundal (Earring) Left -->
    <g transform="translate(46, 92)">
      <circle cx="0" cy="0" r="3.2" fill="url(#pureGold)" stroke="#FFF8D6" stroke-width="0.6" />
      <circle cx="0" cy="0" r="1.5" fill="#E53935" />
      <path d="M0 3 L0 7" stroke="url(#brightGold)" stroke-width="1" stroke-linecap="round" />
      <circle cx="0" cy="8" r="1.2" fill="#FFFBE0" />
    </g>

    <!-- Left Ear (Viewer Right) -->
    <path d="M121 66 C141 64 158 72 156 91 C154 104 140 106 132 102 C135 96 134 84 124 77" 
          stroke="url(#pureGold)" stroke-width="4.2" stroke-linecap="round" fill="none" />
    <!-- Ear Inner Filigree -->
    <path d="M144 78 C150 85 148 94 138 96" 
          stroke="url(#brightGold)" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M140 83 C143 87 142 91 136 92" 
          stroke="#FFEAA7" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.75" />
    <!-- Royal Kundal (Earring) Right -->
    <g transform="translate(154, 92)">
      <circle cx="0" cy="0" r="3.2" fill="url(#pureGold)" stroke="#FFF8D6" stroke-width="0.6" />
      <circle cx="0" cy="0" r="1.5" fill="#E53935" />
      <path d="M0 3 L0 7" stroke="url(#brightGold)" stroke-width="1" stroke-linecap="round" />
      <circle cx="0" cy="8" r="1.2" fill="#FFFBE0" />
    </g>

    <!-- DIVINE FOREHEAD (MASTAKA) -->
    <path d="M78 66 C78 66 87 71 100 71 C113 71 122 66 122 66" 
          stroke="url(#brightGold)" stroke-width="2.2" stroke-linecap="round" fill="none" />

    <!-- AUSPICIOUS TRISHUL TILAK (तिलक) -->
    <!-- Center Red Trishul Line -->
    <path d="M98.6 67 L98.6 82 C98.6 83.2 101.4 83.2 101.4 82 L101.4 67 Z" fill="url(#sindoor)" />
    <!-- Outer Trishul Curvatures -->
    <path d="M92.5 70 C94.5 76 98.6 79 98.6 79" stroke="#E53935" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M107.5 70 C105.5 76 101.4 79 101.4 79" stroke="#E53935" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Chandan Crescent / Bindi -->
    <ellipse cx="100" cy="74" rx="2.4" ry="2.4" fill="#FFFBE0" stroke="url(#deepGold)" stroke-width="0.8" />
    <circle cx="100" cy="84" r="1.4" fill="#FFA000" />

    <!-- EYES (NETRA) - Serene & Merciful -->
    <!-- Right Eye (Viewer Left) -->
    <path d="M81 79 C84 76 89 77 91 80" stroke="url(#brightGold)" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <circle cx="86" cy="81" r="1.3" fill="url(#deepGold)" />

    <!-- Left Eye (Viewer Right) -->
    <path d="M119 79 C116 76 111 77 109 80" stroke="url(#brightGold)" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <circle cx="114" cy="81" r="1.3" fill="url(#deepGold)" />

    <!-- TUSKS (DANTA) -->
    <!-- Full Right Tusk -->
    <path d="M81 92 C79 96 74 100 70 100 C72 97 78 90 80 89 Z" fill="#FFFEEA" stroke="url(#brightGold)" stroke-width="0.7" />
    <!-- Broken Left Tusk (Ekadanta symbol of wisdom) -->
    <path d="M119 92 C120 94.5 123 96 125 96 C124 93.5 121 90 120 89 Z" fill="#FFFEEA" stroke="url(#brightGold)" stroke-width="0.7" />

    <!-- VAKRATUNDA (CURVED TRUNK) -->
    <!-- Master curve sweeping downwards and turning left into an auspicious loop -->
    <path d="M95 83 C95 93 96 108 98 120 C99 135 94 146 83 148 C71 150 61 140 64 127 C66 117 77 113 83 120 C87 124 84 133 77 133 C74 133 71 130 72 125" 
          stroke="url(#pureGold)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Trunk Light Edge (Gives 3D Metallic Cylinder effect) -->
    <path d="M100 87 C100 97 101 110 102 122 C103 131 99 139 90 142" 
          stroke="url(#brightGold)" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.95" />

    <!-- Trunk Golden Ring Ornaments -->
    <g stroke="#FFE885" stroke-width="1.8" stroke-linecap="round">
      <path d="M94.5 101 C97.5 102 101 101.5 103 100.5" />
      <path d="M95 110 C98.5 111 102 110.5 104 109.5" />
      <path d="M95.5 119 C99 120 102.5 119.5 104.5 118.5" />
    </g>

    <!-- MODAK / PRASAD (Held gracefully by the trunk swirl) -->
    <g transform="translate(56, 114)">
      <!-- Sweet Glow Base -->
      <circle cx="11" cy="11" r="10" fill="#FFC107" opacity="0.25" filter="url(#royalGlow)" />
      <!-- Modak Body -->
      <path d="M11 2 C7 7 5 12 5 15 C5 19 8 21 11 21 C14 21 17 19 17 15 C17 12 15 7 11 2 Z" 
            fill="url(#modakGlow)" stroke="#FFF8D6" stroke-width="0.8" />
      <!-- Fluting lines on modak -->
      <path d="M11 2 L11 21" stroke="#FFFDF0" stroke-width="0.6" opacity="0.75" />
      <path d="M8 5 C8 10 8 16 9.5 19.5" stroke="#FFFDF0" stroke-width="0.5" opacity="0.6" />
      <path d="M14 5 C14 10 14 16 12.5 19.5" stroke="#FFFDF0" stroke-width="0.5" opacity="0.6" />
      <!-- Silver Vark / Glistening Highlight -->
      <circle cx="10" cy="6" r="1.2" fill="#FFFFFF" />
      <circle cx="12" cy="10" r="0.8" fill="#FFFDF0" />
    </g>

    <!-- ABHAYA MUDRA (BLESSING HAND) - Viewer Right -->
    <g transform="translate(125, 106)">
      <!-- Forearm & Palm -->
      <path d="M0 6 C6 4 12 8 13 15 C14 22 8 28 1 29" stroke="url(#pureGold)" stroke-width="3.6" stroke-linecap="round" fill="none" />
      <!-- Golden Kada / Bracelet on wrist -->
      <path d="M1 9 C4 11 7 11 10 9" stroke="#FFE885" stroke-width="2" stroke-linecap="round" />
      <!-- Sacred ॐ (AUM) in the center of palm -->
      <circle cx="11" cy="17" r="4.2" fill="url(#brightGold)" stroke="#8F620D" stroke-width="0.5" />
      <circle cx="11" cy="17" r="2.2" fill="#E53935" />
      <!-- Rays from hand -->
      <line x1="16" y1="13" x2="19" y2="11" stroke="#FFE885" stroke-width="1" stroke-linecap="round" />
      <line x1="18" y1="17" x2="22" y2="17" stroke="#FFE885" stroke-width="1" stroke-linecap="round" />
      <line x1="16" y1="21" x2="19" y2="23" stroke="#FFE885" stroke-width="1" stroke-linecap="round" />
    </g>

    <!-- SACRED JANEVU / YAJNOPAVITA (Golden sacred cord flowing across chest) -->
    <path d="M88 102 C90 114 96 130 112 142" 
          stroke="url(#brightGold)" stroke-width="1.2" stroke-dasharray="2 2" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- DIVINE CELESTIAL SPARKLES (तारक चमक) -->
    <g fill="#FFFDF0" opacity="0.9">
      <!-- Top left sparkle -->
      <polygon points="48,46 49,49 52,50 49,51 48,54 47,51 44,50 47,49" />
      <!-- Top right sparkle -->
      <polygon points="152,46 153,49 156,50 153,51 152,54 151,51 148,50 151,49" />
      <!-- Bottom right sparkle -->
      <polygon points="144,142 145,144 147,145 145,146 144,148 143,146 141,145 143,144" />
      <!-- Small light dots -->
      <circle cx="40" cy="74" r="1" />
      <circle cx="160" cy="74" r="1" />
      <circle cx="100" cy="184" r="1.2" fill="#FFEAA7" />
    </g>
  </g>
</svg>
